name: CI

on:
  # Every PR, whatever its base — so stacked PRs get checked too.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tishacare_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      # Placeholder: apps/web/lib/bot.ts requires a token at module load, which
      # `next build` evaluates. No real Telegram or DB traffic happens here.
      TELEGRAM_BOT_TOKEN: "123456:ci-placeholder-token"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tishacare_ci?schema=public"
      # Plain Postgres here — no pooler — so the direct URL is the same one.
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/tishacare_ci?schema=public"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma Client
        run: npx prisma generate --schema=packages/db/prisma/schema.prisma

      - name: Prisma schema is valid
        run: npx prisma validate --schema=packages/db/prisma/schema.prisma

      - name: Migrations apply cleanly on a fresh DB
        run: npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

      - name: Migrations reproduce schema.prisma (no drift)
        run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel packages/db/prisma/schema.prisma
          --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (web)
        run: npm run build -w @tishacare/web
